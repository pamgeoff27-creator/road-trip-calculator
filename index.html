<style>
:root{
  --bg:#f7f7f9;
  --card:#ffffff;
  --text:#111111;
  --muted:#737373;
  --border:#d7d7dc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.app{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:16px 12px calc(22px + env(safe-area-inset-bottom));
}
h1{
  margin:8px 0 4px;
  font-size:34px;
  line-height:1.03;
  letter-spacing:-.03em;
}
.sub{
  margin:0 0 13px;
  color:#666;
  font-size:15px;
  line-height:1.35;
}
.card{
  background:var(--card);
  border-radius:22px;
  padding:14px;
  margin:0 0 10px;
  box-shadow:0 4px 18px rgba(0,0,0,.055);
}
.section-gap{margin-top:10px}
.field{position:relative;margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field-label{
  display:block;
  margin:0 0 5px;
  font-size:14px;
  font-weight:700;
  color:#646464;
}
.input-row{
  display:flex;
  gap:7px;
  align-items:center;
}
input{
  width:100%;
  min-width:0;
  height:44px;
  padding:0 12px;
  border:2px solid var(--border);
  border-radius:13px;
  background:#fff;
  color:#111;
  font-size:17px;
  outline:none;
}
input:focus{border-color:#9a9aa0}
.clear{
  flex:0 0 42px;
  width:42px;
  height:42px;
  border:1px solid #d0d0d5;
  border-radius:12px;
  background:#fff;
  color:#666;
  font-size:25px;
  line-height:1;
  cursor:pointer;
}
.suggestions{
  position:absolute;
  left:0;
  right:49px;
  top:70px;
  z-index:20;
  background:#fff;
  border:1px solid #d6d6da;
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.13);
}
.suggestions:empty{display:none}
.suggestions button{
  display:block;
  width:100%;
  border:0;
  border-bottom:1px solid #ececef;
  padding:12px;
  background:#fff;
  text-align:left;
  color:#111;
  font-size:15px;
}
.suggestions button:last-child{border-bottom:0}
.suggestions button:active{background:#f1f1f3}
.hint{
  margin-top:4px;
  color:#8a8a8f;
  font-size:11px;
}
.journey{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:2px;
}
.journey button{
  min-height:44px;
  border:0;
  border-radius:13px;
  background:#ededf1;
  color:#111;
  font-size:15px;
  font-weight:700;
}
.journey button.active{
  background:#111;
  color:#fff;
}
.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.details .field{margin:0}
.calculate{
  width:100%;
  min-height:50px;
  border:0;
  border-radius:15px;
  background:#111;
  color:#fff;
  font-size:18px;
  font-weight:800;
}
.calculate:disabled{opacity:.45}
.status{
  min-height:18px;
  margin-top:8px;
  text-align:center;
  color:#777;
  font-size:12px;
}
.error{
  display:none;
  margin-top:8px;
  padding:9px 11px;
  border-radius:12px;
  background:#fff0f0;
  color:#a51d1d;
  font-size:12px;
}

<body>
<main class="app">
  <h1>Road Trip Cost</h1>
  <p class="sub">Work out the fuel cost and cost per passenger.</p>
  <div class="color-car" aria-hidden="true">
    <div class="sun"></div><div class="hill1"></div><div class="hill2"></div>
    <div class="road"></div><div class="dash"></div>
    <div class="car"><div class="window"></div><i class="wheel w1"></i><i class="wheel w2"></i></div>
  </div>


  <section class="card">
    <div class="field">
      <label class="field-label" for="from">From</label>
      <div class="input-row">
        <input id="from" placeholder="e.g. York" autocomplete="off" inputmode="text">
        <button type="button" class="clear" id="clearFrom" aria-label="Clear From">×</button>
      </div>
      <div id="fromSug" class="suggestions"></div>
      <div class="hint">Choose the correct place from the suggestions.</div>
    </div>

    <div class="field">
      <label class="field-label" for="to">To</label>
      <div class="input-row">
        <input id="to" placeholder="e.g. London" autocomplete="off" inputmode="text">
        <button type="button" class="clear" id="clearTo" aria-label="Clear To">×</button>
      </div>
      <div id="toSug" class="suggestions"></div>
      <div class="hint">Choose the correct place from the suggestions.</div>
    </div>

    <div class="journey" aria-label="Journey type">
      <button type="button" id="oneWay" class="active">One way</button>
      <button type="button" id="returnJourney">Return journey</button>
    </div>
  </section>

  <section class="card">
    <div class="details">
      <div class="field">
        <label class="field-label" for="travellers">Passengers</label>
        <input id="travellers" type="number" min="1" step="1" value="1" inputmode="numeric">
      </div>
      <div class="field">
        <label class="field-label" for="price">Fuel price (£/litre)</label>
        <input id="price" type="number" min="0" step="0.01" value="1.56" inputmode="decimal">
      </div>
      <div class="field">
        <label class="field-label" for="mpg">Fuel economy (UK MPG)</label>
        <input id="mpg" type="number" min="1" step="0.1" value="38" inputmode="decimal">
      </div>
    </div>
  </section>

  <button type="button" id="calc" class="calculate" disabled>Calculate</button>
  <div id="status" class="status" aria-live="polite"></div>
  <div id="error" class="error"></div>

  <section id="resultsCard" class="card results-card results">
    <h2>Trip estimate</h2>

    <div class="primary">
      <span class="small">Cost per person</span>
      <span class="value" id="person">—</span>
    </div>

    <div class="primary distance">
      <span class="small">Distance</span>
      <span class="value" id="distance">—</span>
    </div>

    <div class="extra">
      <div class="metric"><span>Fuel used</span><strong id="fuel">—</strong></div>
      <div class="metric"><span>Total fuel cost</span><strong id="total">—</strong></div>
      <div class="metric"><span>Cost per mile</span><strong id="mile">—</strong></div>
      <div class="metric"><span>Passengers</span><strong id="people">—</strong></div>
    </div>

    <button type="button" id="reset" class="reset">Reset</button>
  </section>
</main>

<script>
(() => {
  const state = { from:null, to:null, returnJourney:false };
  const $ = id => document.getElementById(id);

  function setError(message){
    $("error").textContent = message;
    $("error").style.display = "block";
    $("status").textContent = "";
  }

  function clearError(){
    $("error").style.display = "none";
    $("error").textContent = "";
  }

  function updateCalcButton(){
    $("calc").disabled = !(state.from && state.to);
  }

  function shortPlaceName(p){
    const a = p.address || {};
    const locality = a.suburb || a.village || a.town || a.city || a.municipality || a.county || "";
    let region = "";
    if(a.city && a.city !== locality) region = a.city;
    else if(a.county && a.county !== locality) region = a.county;
    region = region.replace(/^City of /i, "");
    if(locality) return region ? `${locality}, ${region}` : locality;
    return (p.display_name || "").split(",").slice(0,2).join(", ").trim();
  }

  function setupPlace(inputId, suggestionsId, key){
    const input = $(inputId);
    const box = $(suggestionsId);
    let timer = null;
    let controller = null;

    input.addEventListener("input", () => {
      state[key] = null;
      updateCalcButton();
      box.innerHTML = "";
      clearError();

      const q = input.value.trim();
      if(q.length < 3) return;

      clearTimeout(timer);
      if(controller) controller.abort();

      timer = setTimeout(async () => {
        controller = new AbortController();
        try{
          const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=jsonv2&limit=5&addressdetails=1&countrycodes=gb&q=" +
            encodeURIComponent(q);

          const response = await fetch(url, {
            signal: controller.signal,
            headers: {"Accept-Language":"en-GB"}
          });
          if(!response.ok) throw new Error("Lookup failed");
          const places = await response.json();

          box.innerHTML = "";
          if(!places.length){
            setError("No UK places found. Try a different name.");
            return;
          }

          places.forEach(p => {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = shortPlaceName(p);
            b.title = p.display_name || "";
            b.addEventListener("click", () => {
              state[key] = {lat:Number(p.lat), lon:Number(p.lon), name:shortPlaceName(p)};
              input.value = shortPlaceName(p);
              box.innerHTML = "";
              clearError();
              updateCalcButton();
            });
            box.appendChild(b);
          });
        }catch(err){
          if(err.name !== "AbortError") setError("Place lookup failed. Check your internet connection.");
        }
      }, 300);
    });
  }

  function clearPlace(key, inputId, suggestionsId){
    state[key] = null;
    $(inputId).value = "";
    $(suggestionsId).innerHTML = "";
    $("resultsCard").style.display = "none";
    $("status").textContent = "";
    clearError();
    updateCalcButton();
    $(inputId).focus();
  }

  function setJourney(returnTrip){
    state.returnJourney = returnTrip;
    $("oneWay").classList.toggle("active", !returnTrip);
    $("returnJourney").classList.toggle("active", returnTrip);

    if(state.from && state.to){
      $("calc").click();
    }
  }

  setupPlace("from","fromSug","from");
  setupPlace("to","toSug","to");

  $("clearFrom").addEventListener("click", () => clearPlace("from","from","fromSug"));
  $("clearTo").addEventListener("click", () => clearPlace("to","to","toSug"));
  $("oneWay").addEventListener("click", () => setJourney(false));
  $("returnJourney").addEventListener("click", () => setJourney(true));

  document.addEventListener("click", e => {
    ["from","to"].forEach(id => {
      const input = $(id);
      const box = $(id + "Sug");
      if(!input.contains(e.target) && !box.contains(e.target)) box.innerHTML = "";
    });
  });

  $("calc").addEventListener("click", async () => {
    if(!(state.from && state.to)) return;

    clearError();
    $("resultsCard").style.display = "none";
    $("status").textContent = "Calculating driving distance…";
    $("calc").disabled = true;

    try{
      const people = Math.max(1, Math.floor(Number($("travellers").value) || 1));
      const price = Math.max(0, Number($("price").value) || 0);
      const mpg = Math.max(1, Number($("mpg").value) || 1);

      const routeUrl =
        `https://router.project-osrm.org/route/v1/driving/` +
        `${state.from.lon},${state.from.lat};${state.to.lon},${state.to.lat}` +
        `?overview=false`;

      const response = await fetch(routeUrl);
      if(!response.ok) throw new Error("Route failed");
      const data = await response.json();
      if(data.code !== "Ok" || !data.routes || !data.routes.length) throw new Error("No route");

      const oneWayMiles = Number(data.routes[0].distance) / 1609.344;
      const miles = state.returnJourney ? oneWayMiles * 2 : oneWayMiles;
      const litres = (miles / mpg) * 4.54609;
      const total = litres * price;
      const perPerson = total / people;
      const perMile = total / miles;

      $("person").textContent = `£${perPerson.toFixed(2)}`;
      $("distance").textContent = `${miles.toFixed(1)} miles`;
      $("fuel").textContent = `${litres.toFixed(1)} L`;
      $("total").textContent = `£${total.toFixed(2)}`;
      $("mile").textContent = `£${perMile.toFixed(3)}`;
      $("people").textContent = people;

      $("resultsCard").style.display = "block";
      $("status").textContent = "";
    }catch(err){
      console.error(err);
      setError("Could not calculate the route. Please check both places and your internet connection.");
    }finally{
      updateCalcButton();
    }
  });

  $("reset").addEventListener("click", () => {
    state.from = null;
    state.to = null;
    state.returnJourney = false;

    $("from").value = "";
    $("to").value = "";
    $("travellers").value = "1";
    $("price").value = "1.56";
    $("mpg").value = "38";

    $("fromSug").innerHTML = "";
    $("toSug").innerHTML = "";
    $("resultsCard").style.display = "none";
    $("status").textContent = "";
    clearError();

    $("oneWay").classList.add("active");
    $("returnJourney").classList.remove("active");
    updateCalcButton();
    $("from").focus();
  });

  updateCalcButton();
})();
</script>

<script>
(function(){
  const key='roadTripCostSettingsV1';
  const ids=['travellers','price','mpg'];
  function load(){
    try{
      const s=JSON.parse(localStorage.getItem(key)||'{}');
      ids.forEach(id=>{if(s[id]!==undefined) document.getElementById(id).value=s[id];});
    }catch(e){}
  }
  function save(){
    try{
      const s={};
      ids.forEach(id=>s[id]=document.getElementById(id).value);
      localStorage.setItem(key,JSON.stringify(s));
    }catch(e){}
  }
  window.addEventListener('DOMContentLoaded',function(){
    load();
    ids.forEach(id=>{
      const el=document.getElementById(id);
      el.addEventListener('input',save);
      el.addEventListener('change',save);
    });
    const reset=document.getElementById('reset');
    if(reset) reset.addEventListener('click',function(){
      try{localStorage.removeItem(key);}catch(e){}
    });
  });
})();
</script>

</body>
</html>
